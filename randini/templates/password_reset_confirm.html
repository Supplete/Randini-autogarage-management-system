{% extends "base.html" %}
{% block title %}Set New Password | Randini Garage{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:30px;background:linear-gradient(135deg,#f9f4f4,#fff8f0);">
  <div style="background:#fff;padding:44px 40px;border-radius:18px;box-shadow:0 12px 40px rgba(128,0,0,.12);max-width:420px;width:100%;">
    <h4 class="fw-bold text-center mb-4">Set New Password</h4>
    <form method="POST">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label fw-semibold small">{{ field.label }}</label>
        {{ field }}
      </div>
      {% endfor %}
      <button type="submit" class="btn w-100 fw-bold rounded-pill mt-2" style="height:50px;background:#800000;color:#fff;border:none;">
        Set New Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
