    <td style="padding: 20px; text-align: center;">
      <table border="0" cellspacing="0" cellpadding="0" align="center">

            </div>

          <td style="vertical-align: middle; text-align: left;">

            <div style="color: rgba(255,255,255,0.8); font-size: 12px; font-family: Arial, sans-serif; margin-top: 4px;">Expert Auto Care Since 2005 | +254 711 962 088</div>
          </td>
        </tr>
