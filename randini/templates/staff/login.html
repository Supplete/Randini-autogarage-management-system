<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login | Randini Garage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background:linear-gradient(135deg,#800000 0%,#400000 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; font-size:16px; }
    .login-card { background:#fff; border-radius:20px; padding:56px 48px; max-width:460px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.35); }
    .brand-mark { text-align:center; margin-bottom:36px; }
    .brand-mark .icon { background:#800000; color:#ffc107; width:72px; height:72px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:2rem; margin-bottom:16px; }
    .brand-mark h4 { color:#800000; font-weight:700; margin:0; font-size:1.4rem; }
    .brand-mark p  { color:#999; font-size:1rem; margin:8px 0 0; }
    .form-control { height:54px; border-radius:12px; border:1.5px solid #ddd; font-size:1.05rem; }
    .form-control:focus { border-color:#800000; box-shadow:0 0 0 3px rgba(128,0,0,.1); }
    .form-label { font-weight:600; font-size:1.05rem; margin-bottom:8px; }
    .btn-staff { height:54px; background:#800000; border:none; color:#fff; font-weight:700; border-radius:12px; width:100%; font-size:1.1rem; transition:.3s; }
    .btn-staff:hover { background:#600000; color:#fff; }
    .pw-wrap { position:relative; }
    .toggle-pw { position:absolute; right:16px; top:50%; transform:translateY(-50%); cursor:pointer; color:#800000; font-size:0.85rem; font-weight:700; text-transform:uppercase; user-select:none; z-index:5; }
    .alert { font-size:1rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-mark">
      <div class="icon"><i class="bi bi-shield-lock-fill"></i></div>
      <h4>Staff Portal</h4>
      <p>Randini Auto Garage</p>
    </div>

    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-danger py-3 rounded-3 mb-4">
      <i class="bi bi-exclamation-circle me-2"></i>{{ message }}
    </div>
    {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="mb-4">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="staff@randinigarage.com" required autofocus>
      </div>
      <div class="mb-5 pw-wrap">
        <label class="form-label">Password</label>
        <input type="password" name="password" id="pw" class="form-control" placeholder="Your password" required>
        <span class="toggle-pw" onclick="var f=document.getElementById('pw');f.type=f.type=='password'?'text':'password';this.textContent=f.type=='password'?'Show':'Hide'">Show</span>
      </div>
      <button type="submit" class="btn-staff">Sign In to Staff Portal</button>
    </form>

    <div class="text-center mt-5">
      <a href="/" class="text-muted text-decoration-none" style="font-size:1rem;"><i class="bi bi-arrow-left me-2"></i>Back to Main Site</a>
    </div>
  </div>
</body>
</html>
