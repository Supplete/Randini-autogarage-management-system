
{% extends 'staff/admin_base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card border-0 shadow-sm" style="border-radius: 15px;">
                <div class="card-body p-4">
                    <h3 class="fw-bold mb-4" style="color: #800000;">edit: {{ part.name }}</h3>
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-8">
                                {{ form.as_p }}
                            </div>
                            <div class="col-md-4 text-center">
                                <label class="small fw-bold text-muted">current preview</label>
                                {% if part.image %}
                                    <img src="{{ part.image.url }}" class="img-fluid rounded mt-2 shadow-sm border">
                                {% else %}
                                    <div class="bg-light rounded p-4 text-muted small mt-2 border-dashed">no image</div>
                                {% endif %}
                            </div>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'staff_inventory' %}" class="btn btn-light px-4">back</a>
                            <button type="submit" class="btn btn-primary px-4" style="background-color: #800000; border: none;">update changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
