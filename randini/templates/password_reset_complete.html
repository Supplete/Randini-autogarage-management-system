{% extends "base.html" %}
{% block title %}Password Reset Complete | Randini Garage{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:30px;background:linear-gradient(135deg,#f9f4f4,#fff8f0);">
  <div style="background:#fff;padding:44px 40px;border-radius:18px;box-shadow:0 12px 40px rgba(128,0,0,.12);max-width:420px;width:100%;text-align:center;">
    <i class="bi bi-shield-check-fill" style="font-size:3rem;color:green;"></i>
    <h4 class="fw-bold mt-3">Password Reset Complete!</h4>
    <p class="text-muted">Your password has been updated successfully. You can now log in with your new password.</p>
    <a href="{% url 'login' %}" class="btn rounded-pill px-5 mt-2" style="background:#800000;color:#fff;">Login Now</a>
  </div>
</div>
{% endblock %}
